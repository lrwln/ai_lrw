    <script>
        // const streetCarsPromise = fetch('http://data.ratp.fr/api/datasets/1.0/search/?q=paris');

        const getStory = async () => fetch('https://v1.hitokoto.cn/?c=i&encode=json')
        const getRatp = async () => fetch('https://v1.hitokoto.cn/?c=i&encode=json')
        async function main() {
            const story = await getStory();
            const ratp = await getRatp();
            // Promise.all([getStory(), getRatp()])//并行执行  参数为数组，数组中的元素为Promise对象
            const res = await Promise.all([getStory(), getRatp()]);
            console.log(res);
            const jsonPromise = res.map(item => item.json());
            const jsonRes = await Promise.all(jsonPromise);
            console.log(jsonRes);


        }
        main();

    </script>
